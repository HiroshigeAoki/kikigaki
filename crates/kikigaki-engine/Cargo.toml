[package]
name = "kikigaki-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Mojicast punctuation inference through `ort` (dlopen of a separate libonnxruntime).
punct = ["dep:ort"]

[dependencies]
kikigaki-core = { path = "../kikigaki-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sherpa-onnx = "=1.13.6"
tempfile.workspace = true
sha2 = "0.10"
hex = "0.4"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"], optional = true }
